<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Australia’s Flight Network</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body{margin:0;background:#fff;color:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    .page{max-width:1100px;margin:40px auto 64px;padding:0 16px}
    .layout{display:grid;grid-template-columns:minmax(600px,1.4fr) minmax(420px,1fr);gap:18px;align-items:start}
    @media (max-width:1080px){.layout{grid-template-columns:1fr}}
    .viz-card{background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);padding:20px;overflow:hidden}
    .text-card{padding:0 6px}
    #citiesMap,#top_routes,#otp_overview{width:100%}
    .mt-36{margin-top:36px}
  </style>
</head>
<body>
  <main class="page">
    <section class="layout">
      <div class="viz-card"><div id="citiesMap"></div></div>
      <aside class="text-card">
        <h3>The Map</h3>
        <p>Strong east-coast routes reflect where people live and work; thinner links to Perth/Darwin show isolation.</p>
      </aside>
    </section>

    <section class="layout mt-36">
      <div class="viz-card">
        <h3 style="margin:0 0 10px">Top routes</h3>
        <div id="top_routes"></div>
      </div>
      <aside class="text-card">
        <h3>Route Rankings</h3>
        <p>“Golden Triangle” routes dominate most years.</p>
      </aside>
    </section>

    <section class="viz-card mt-36">
      <h3 style="margin:0 0 10px">On-Time Performance</h3>
      <div id="otp_overview"></div>
    </section>
  </main>

  <script>
    vegaEmbed('#citiesMap','charts/cities_map.json',{actions:false}).catch(console.error);
    vegaEmbed('#top_routes','charts/top_routes.json',{actions:false}).catch(console.error);
    vegaEmbed('#otp_overview','charts/on_time_perf.json',{actions:false}).catch(console.error);
  </script>
</body>
</html>
